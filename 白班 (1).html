<!DOCTYPE html>
<html lang="zh-TW">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>SICU 智慧護理紀錄站 v3.0</title>
    <style>
        /* --- 全局變數 --- */
        :root {
            --primary: #2c3e50;
            --accent: #3498db;
            --urgent-bg: #fff5f5;
            --urgent-border: #e74c3c;
            --sidebar-width: 320px;
            --modal-overlay: rgba(0, 0, 0, 0.6);
        }

        body {
            font-family: "Microsoft JhengHei", -apple-system, sans-serif;
            margin: 0;
            height: 100vh;
            display: flex;
            flex-direction: column;
            background-color: #f1f2f6;
            overflow: hidden;
        }

        /* --- Header --- */
        header {
            background: var(--primary);
            color: white;
            padding: 0 20px;
            height: 60px;
            display: flex;
            align-items: center;
            justify-content: space-between;
            box-shadow: 0 2px 5px rgba(0,0,0,0.1);
            z-index: 100;
        }

        .header-title { font-size: 1.2rem; font-weight: bold; }
        .menu-btn {
            background: rgba(255,255,255,0.2);
            border: 1px solid white;
            color: white;
            padding: 6px 15px;
            border-radius: 4px;
            cursor: pointer;
            transition: 0.3s;
            font-size: 0.9rem;
        }
        .menu-btn:hover { background: rgba(255,255,255,0.4); }

        /* --- 主版面 (2/3 vs 1/3) --- */
        .main-container {
            display: flex;
            flex: 1;
            padding: 15px;
            gap: 15px;
            overflow: hidden;
            position: relative;
        }

        .panel {
            background: white;
            border-radius: 8px;
            box-shadow: 0 4px 6px rgba(0,0,0,0.05);
            display: flex;
            flex-direction: column;
            overflow: hidden;
        }

        .panel-routine { flex: 2; border-top: 5px solid var(--accent); }
        .panel-urgent { flex: 1; border-top: 5px solid var(--urgent-border); background: var(--urgent-bg); }

        .panel-header {
            padding: 12px 15px;
            font-weight: bold;
            border-bottom: 1px solid #eee;
            background: rgba(255,255,255,0.8);
            backdrop-filter: blur(5px);
            position: sticky;
            top: 0;
            z-index: 10;
        }

        .task-list { flex: 1; overflow-y: auto; padding: 10px; }

        /* --- 任務卡片 --- */
        .task-card {
            background: white;
            border: 1px solid #e1e1e1;
            border-radius: 6px;
            margin-bottom: 10px;
            position: relative;
            transition: all 0.2s;
        }
        .task-card:hover { border-color: var(--accent); box-shadow: 0 2px 8px rgba(0,0,0,0.08); }

        .task-header { display: flex; align-items: center; padding: 10px; cursor: pointer; }
        .task-checkbox { width: 20px; height: 20px; margin-right: 12px; cursor: pointer; z-index: 2; }
        .time-badge { background: #dfe6e9; color: #636e72; padding: 2px 6px; border-radius: 4px; font-size: 0.85rem; margin-right: 10px; font-weight: bold; }
        .task-title { font-weight: 500; flex: 1; }
        .expand-hint { font-size: 0.8rem; color: #b2bec3; }

        .task-body { display: none; padding: 0 10px 10px 42px; border-top: 1px dashed #eee; }
        .task-body.open { display: block; }

        textarea.record-input {
            width: 95%; min-height: 80px; padding: 8px;
            border: 1px solid #ddd; border-radius: 4px;
            font-size: 0.9rem; font-family: monospace;
            resize: vertical; background: #fafafa;
        }

        /* --- 側欄 (Sidebar) --- */
        .sidebar {
            position: absolute; top: 0; left: -340px;
            width: var(--sidebar-width); height: 100%;
            background: #2d3436; color: #dfe6e9;
            z-index: 200; transition: left 0.3s ease;
            box-shadow: 2px 0 10px rgba(0,0,0,0.2);
            display: flex; flex-direction: column;
        }
        .sidebar.active { left: 0; }

        .sidebar-header {
            padding: 10px; background: #000;
            display: flex; justify-content: space-between; align-items: center;
        }
        .sidebar-tabs { display: flex; background: #353b48; }
        .tab-btn {
            flex: 1; padding: 10px; border: none; background: transparent;
            color: #b2bec3; cursor: pointer; font-weight: bold;
            border-bottom: 3px solid transparent;
        }
        .tab-btn.active { color: white; border-bottom-color: var(--accent); background: #2d3436; }
        
        .sidebar-content { flex: 1; overflow-y: auto; padding: 15px; display: none; }
        .sidebar-content.active { display: block; }

        /* 已完成項目樣式 */
        .completed-item {
            background: #636e72; margin-bottom: 10px; padding: 10px;
            border-radius: 4px; font-size: 0.9rem; border-left: 3px solid #00b894;
        }
        .completed-time { color: #fab1a0; font-size: 0.8rem; margin-bottom: 5px; }
        .completed-note { 
            background: rgba(0,0,0,0.2); padding: 5px; border-radius: 3px; 
            margin-top: 5px; white-space: pre-wrap; font-family: monospace; 
        }

        /* SOP 列表樣式 */
        .sop-item {
            background: white; color: #2d3436; margin-bottom: 8px; padding: 12px;
            border-radius: 4px; cursor: pointer; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
            transition: 0.2s;
        }
        .sop-item:hover { background: var(--accent); color: white; }
        .sop-arrow { font-size: 1.2rem; }

        /* --- 彈跳視窗 (Modal) --- */
        .modal-overlay {
            position: fixed; top: 0; left: 0; width: 100%; height: 100%;
            background: var(--modal-overlay); z-index: 1000;
            display: none; justify-content: center; align-items: center;
        }
        .modal-overlay.active { display: flex; }

        .modal-content {
            background: white; width: 90%; max-width: 600px; max-height: 85vh;
            border-radius: 8px; overflow-y: auto; position: relative;
            box-shadow: 0 10px 25px rgba(0,0,0,0.5); display: flex; flex-direction: column;
        }
        .modal-header {
            background: var(--primary); color: white; padding: 15px;
            font-size: 1.2rem; font-weight: bold;
            display: flex; justify-content: space-between; align-items: center;
            position: sticky; top: 0;
        }
        .modal-body { padding: 20px; line-height: 1.6; color: #333; }
        
        .modal-section { margin-bottom: 20px; }
        .modal-section h3 { 
            border-left: 5px solid var(--urgent-border); padding-left: 10px; 
            color: var(--primary); margin-bottom: 10px; 
        }
        .modal-list { padding-left: 20px; margin: 0; }
        .modal-list li { margin-bottom: 5px; }
        
        .close-modal-btn { background: none; border: none; color: white; font-size: 1.5rem; cursor: pointer; }

        /* --- 底部輸入區 --- */
        .footer-input {
            background: white; padding: 15px; border-top: 1px solid #ccc;
            display: flex; gap: 10px; align-items: center;
        }
        /* 改為文字輸入 */
        input.time-input { 
            width: 80px; padding: 10px; border: 1px solid #ccc; 
            border-radius: 4px; text-align: center; font-family: monospace;
        }
        input.text-input { flex: 1; padding: 10px; border: 1px solid #ccc; border-radius: 4px; }
        
        .btn-add {
            background: var(--urgent-border); color: white; border: none;
            padding: 10px 20px; border-radius: 4px; cursor: pointer; font-weight: bold;
        }
        .btn-add:hover { background: #c0392b; }

        /* RWD */
        @media (max-width: 768px) {
            .main-container { flex-direction: column; }
        }
    </style>
</head>
<body>

<div class="modal-overlay" id="sopModal" onclick="closeModal(event)">
    <div class="modal-content" onclick="event.stopPropagation()">
        <div class="modal-header">
            <span id="modalTitle">任務標題</span>
            <button class="close-modal-btn" onclick="closeModal()">×</button>
        </div>
        <div class="modal-body" id="modalBody">
            </div>
    </div>
</div>

<div class="sidebar" id="sidebar">
    <div class="sidebar-header">
        <span>選單 / 歷史紀錄</span>
        <button class="menu-btn" onclick="toggleSidebar()">✕ 關閉</button>
    </div>
    
    <div class="sidebar-tabs">
        <button class="tab-btn active" onclick="switchTab('completed')">✅ 已完成</button>
        <button class="tab-btn" onclick="switchTab('sop')">📖 常見任務</button>
    </div>

    <div id="tab-completed" class="sidebar-content active">
        <div id="completedList"></div>
    </div>

    <div id="tab-sop" class="sidebar-content">
        <div id="sopList"></div>
    </div>
</div>

<header>
    <button class="menu-btn" onclick="toggleSidebar()">☰ 選單 & 紀錄</button>
    <div class="header-title">SICU 白班護理紀錄</div>
    <div style="width: 80px;"></div> 
</header>

<div class="main-container">
    <div class="panel panel-routine">
        <div class="panel-header">📋 常規流程 (點擊文字展開紀錄)</div>
        <div class="task-list" id="routineList"></div>
    </div>

    <div class="panel panel-urgent">
        <div class="panel-header">🚨 緊急待辦 / 醫囑</div>
        <div class="task-list" id="urgentList"></div>
    </div>
</div>

<div class="footer-input">
    <input type="text" id="inputTime" class="time-input" placeholder="時間" maxlength="5">
    <input type="text" id="inputText" class="text-input" placeholder="輸入臨時醫囑或任務 (Enter 送出)..." onkeypress="handleEnter(event)">
    <button class="btn-add" onclick="addTask()">新增</button>
</div>

    // --- DOM 元素 ---
    const routineContainer = document.getElementById('routineList');
    const urgentContainer = document.getElementById('urgentList');
    const completedContainer = document.getElementById('completedList');
    const sopListContainer = document.getElementById('sopList');
    const sidebar = document.getElementById('sidebar');

    // --- 初始化 ---
    function init() {
        // 渲染常規任務
        routineData.forEach(item => {
            createTaskElement(item.time, item.text, item.template, routineContainer, 'routine');
        });
        // 渲染 SOP 列表
        renderSopList();
    }

    // --- 核心功能：建立任務卡片 ---
    function createTaskElement(time, text, templateContent, container, type) {
        const card = document.createElement('div');
        card.className = 'task-card';
        
        const header = document.createElement('div');
        header.className = 'task-header';
        
        const checkbox = document.createElement('input');
        checkbox.type = 'checkbox';
        checkbox.className = 'task-checkbox';
        checkbox.onclick = (e) => {
            e.stopPropagation();
            completeTask(card, time, text, textarea.value);
        };

        const contentDiv = document.createElement('div');
        contentDiv.className = 'task-title';
        contentDiv.innerHTML = `<span class="time-badge">${time}</span> ${text}`;
        
        const hint = document.createElement('div');
        hint.className = 'expand-hint';
        hint.innerText = templateContent !== null ? '▼ 紀錄' : '';

        header.appendChild(checkbox);
        header.appendChild(contentDiv);
        header.appendChild(hint);

        const body = document.createElement('div');
        body.className = 'task-body';
        const textarea = document.createElement('textarea');
        textarea.className = 'record-input';
        textarea.placeholder = "在此輸入護理紀錄...";
        textarea.value = templateContent || ""; 
        body.appendChild(textarea);

        // 展開/收合
        header.onclick = () => {
            const isOpen = body.classList.contains('open');
            body.classList.toggle('open');
            hint.innerText = isOpen ? '▼ 紀錄' : '▲ 收合';
        };

        card.appendChild(header);
        card.appendChild(body);
        container.appendChild(card);
    }

    // --- 功能：新增緊急任務 ---
    function addTask() {
        const timeInput = document.getElementById('inputTime');
        const textInput = document.getElementById('inputText');
        const text = textInput.value.trim();

        if (!text) return;

        let time = timeInput.value.trim();
        // 如果沒填時間，自動抓現在
        if (!time) {
            const now = new Date();
            time = `${String(now.getHours()).padStart(2,'0')}:${String(now.getMinutes()).padStart(2,'0')}`;
        }

        createTaskElement(time, text, "處置過程：\n結果：", urgentContainer, 'urgent');
        
        textInput.value = '';
        timeInput.value = ''; // 清空時間欄位，方便下次輸入
        urgentContainer.scrollTop = urgentContainer.scrollHeight;
    }

    // --- 功能：完成任務 (移至側欄) ---
    function completeTask(cardElement, time, text, note) {
        cardElement.style.opacity = '0';
        cardElement.style.transform = 'translateX(20px)';
        
        setTimeout(() => {
            cardElement.remove();
            
            const historyItem = document.createElement('div');
            historyItem.className = 'completed-item';
            
            let noteHtml = note && note.trim() !== "" 
                ? `<div class="completed-note">${note}</div>` 
                : "";

            const now = new Date();
            const dateStr = `${now.getMonth()+1}/${now.getDate()}`;

            historyItem.innerHTML = `
                <div class="completed-time">${dateStr} ${time} - 已完成</div>
                <div style="font-weight:bold;">${text}</div>
                ${noteHtml}
            `;
            
            completedContainer.insertBefore(historyItem, completedContainer.firstChild);
        }, 200);
    }

    // --- 側欄與分頁邏輯 ---
    function toggleSidebar() {
        sidebar.classList.toggle('active');
    }

    function switchTab(tabName) {
        // 切換按鈕樣式
        document.querySelectorAll('.tab-btn').forEach(btn => btn.classList.remove('active'));
        if(tabName === 'completed') document.querySelectorAll('.tab-btn')[0].classList.add('active');
        if(tabName === 'sop') document.querySelectorAll('.tab-btn')[1].classList.add('active');

        // 切換內容顯示
        document.querySelectorAll('.sidebar-content').forEach(content => content.classList.remove('active'));
        document.getElementById(`tab-${tabName}`).classList.add('active');
    }

    // --- SOP 系統邏輯 ---
    function renderSopList() {
        sopListContainer.innerHTML = '';
        for (const [key, data] of Object.entries(sopData)) {
            const div = document.createElement('div');
            div.className = 'sop-item';
            div.innerHTML = `<span>${data.title}</span><span class="sop-arrow">›</span>`;
            div.onclick = () => openModal(data);
            sopListContainer.appendChild(div);
        }
    }

    function openModal(data) {
        const modal = document.getElementById('sopModal');
        const title = document.getElementById('modalTitle');
        const body = document.getElementById('modalBody');

        title.innerText = data.title;
        
        // 構建 Modal 內容 HTML
        let html = '';
        
        // 1. 物品
        if (data.items && data.items.length > 0) {
            html += `<div class="modal-section">
                <h3>📦 準備物品</h3>
                <ul class="modal-list">
                    ${data.items.map(i => `<li>${i}</li>`).join('')}
                </ul>
            </div>`;
        }

        // 2. 流程
        if (data.steps && data.steps.length > 0) {
            html += `<div class="modal-section">
                <h3>⚙️ 任務流程</h3>
                <ol class="modal-list">
                    ${data.steps.map(s => `<li>${s}</li>`).join('')}
                </ol>
            </div>`;
        }

        // 3. 注意事項
        if (data.notes) {
            html += `<div class="modal-section">
                <h3>⚠️ 注意事項</h3>
                <div style="white-space: pre-wrap; padding-left: 20px;">${data.notes}</div>
            </div>`;
        }

        body.innerHTML = html;
        modal.classList.add('active');
    }

    function closeModal(event) {
        // 如果有點擊事件且點在內容區，則不關閉
        if (event && event.target.closest('.modal-content')) return;
        document.getElementById('sopModal').classList.remove('active');
    }

    // --- 輔助：鍵盤輸入 ---
    function handleEnter(e) {
        if (e.key === 'Enter') addTask();
    }

    // 啟動程式
    init();

</script>

</body>
</html>
